    <!-- El espacio de trabajo solo se muestra después de validar la sesión. -->
    <div class="app-shell">
      <!-- Navegacion lateral y opciones disponibles por perfil. -->
      <aside class="sidebar" id="sidebar" aria-label="Menú de QrPass">
        <a class="brand" href="#inicio" data-view="inicio" aria-label="QrPass, inicio">
          <span class="brand-mark" aria-hidden="true">
            <svg class="icon"><use href="#icon-qr" /></svg>
          </span>
          <span class="brand-name">qr<span>pass</span><small>IBAGUÉ · TOLIMA</small></span>
        </a>

        <div data-profile-content="pasajero">
          <div class="sidebar-caption">TU ESPACIO</div>
          <nav class="main-nav" aria-label="Navegación principal">
            <button class="nav-link is-active" data-view="inicio">
              <svg class="icon"><use href="#icon-grid" /></svg><span>Resumen</span>
            </button>
            <button class="nav-link" data-view="qr">
              <svg class="icon"><use href="#icon-qr" /></svg><span>Escanear QR</span>
            </button>
            <button class="nav-link" data-view="historial">
              <svg class="icon"><use href="#icon-clock" /></svg><span>Mis viajes</span>
            </button>
          </nav>

          <div class="sidebar-caption sidebar-caption-spaced">MOVERSE</div>
          <nav class="main-nav" aria-label="Acciones de viaje">
            <button class="nav-link" data-action="payment" data-method="saldo">
              <svg class="icon"><use href="#icon-wallet" /></svg><span>Pagar pasaje</span>
            </button>
            <button class="nav-link" data-action="transfer">
              <svg class="icon"><use href="#icon-arrows" /></svg><span>Traspaso de ruta</span>
            </button>
            <button class="nav-link" data-view="recarga">
              <svg class="icon"><use href="#icon-plus" /></svg><span>Recargar saldo</span>
            </button>
          </nav>
        </div>

        <div data-profile-content="conductor" hidden>
          <div class="sidebar-caption">OPERACIÓN</div>
          <nav class="main-nav" aria-label="Operación del conductor">
            <button class="nav-link is-active" data-view="inicio">
              <svg class="icon"><use href="#icon-bus" /></svg><span>Mi turno y pagos</span>
            </button>
          </nav>
        </div>

        <div class="sidebar-bottom">
          <div class="help-card">
            <span class="help-icon"><svg class="icon"><use href="#icon-spark" /></svg></span>
            <strong id="workspace-help-title">Tu espacio de movilidad.</strong>
            <p id="workspace-help-copy">Saldo, pagos y viajes de tu cuenta.</p>
            <button class="account-link" type="button" data-action="logout">Cerrar sesión <svg class="icon"><use href="#icon-arrow" /></svg></button>
          </div>
          <div class="profile">
            <span class="avatar" id="sidebar-avatar">MC</span>
            <span class="profile-copy"><strong id="sidebar-name">María Camila</strong><small id="sidebar-role">Perfil pasajero</small></span>
            <span class="profile-status" aria-label="Perfil seleccionado"></span>
          </div>
        </div>
      </aside>

      <!-- Area de trabajo: barra superior, aviso y pantalla activa. -->
      <main class="main-area">
        <!-- Contexto de la pagina, perfil, estado de conexion e instalacion. -->
        <header class="topbar">
          <button
            class="mobile-menu icon-button"
            id="menu-toggle"
            aria-label="Abrir menú"
            aria-expanded="false"
            aria-controls="sidebar"
          >
            <svg class="icon"><use href="#icon-menu" /></svg>
          </button>
          <div class="breadcrumb"><span id="breadcrumb-context">Pasajero</span><span class="breadcrumb-slash">/</span><strong id="page-crumb">Resumen</strong></div>
          <div class="topbar-right">
            <div
              class="profile-switcher"
              id="workspace-switcher"
              role="group"
              aria-label="Cambiar entre roles autorizados"
              hidden
            >
              <button type="button" data-profile="pasajero" aria-pressed="false">Pasajero</button>
              <button type="button" data-profile="conductor" aria-pressed="true">Conductor</button>
            </div>
            <span class="service-status" id="connection-status" role="status"><span></span><span id="connection-label">Conectado</span></span>
            <span class="topbar-divider"></span>
            <span class="topbar-date" id="today-date"></span>
            <button
              class="button button-outline install-button"
              id="install-button"
              type="button"
              hidden
            ><svg class="icon"><use href="#icon-download" /></svg> Instalar app</button>
            <span class="avatar avatar-small" id="topbar-avatar">MC</span>
          </div>
        </header>
        <div class="service-banner">
          <span class="service-banner-dot"></span>
          <span><strong>Servicio activo</strong> · Billetera QrPass para tus pasajes.</span>
          <button class="service-info-link" type="button" data-action="platform-info">Más información</button>
        </div>
        <!-- JavaScript coloca aqui la pantalla seleccionada. -->
        <section id="app-content" class="page-content" aria-label="Contenido de la página" aria-live="polite"></section>
        <footer class="site-footer">
          <span>QrPass <span class="footer-dot">·</span> Ibagué</span>
          <button class="footer-info-link" type="button" data-action="privacy-info"><svg class="icon"><use href="#icon-shield" /></svg> Aviso de privacidad</button>
        </footer>
      </main>
    </div>
    <button
      class="sidebar-backdrop"
      id="sidebar-backdrop"
      type="button"
      aria-label="Cerrar menú"
    ></button>
    <!-- Navegacion compacta para pantallas pequenas. -->
    <nav class="mobile-tabbar" id="mobile-tabbar" aria-label="Navegación rápida">
      <button
        class="mobile-tab is-active"
        data-view="inicio"
        data-tab-view="inicio"
        aria-current="page"
      ><svg class="icon"><use href="#icon-grid" /></svg><span>Inicio</span></button>
      <button class="mobile-tab" data-view="qr" data-tab-view="qr"><svg class="icon"><use href="#icon-qr" /></svg><span>Escanear</span></button>
      <button class="mobile-tab" data-view="historial" data-tab-view="historial"><svg class="icon"><use href="#icon-clock" /></svg><span>Viajes</span></button>
      <button class="mobile-tab" data-view="recarga" data-tab-view="recarga"><svg class="icon"><use href="#icon-wallet" /></svg><span>Saldo</span></button>
    </nav>

    <!-- Ventana reutilizable para pagos, recibos y formularios. -->
    <dialog class="modal" id="app-modal" aria-labelledby="modal-title">
      <form method="dialog" class="modal-dismiss"><button class="icon-button" aria-label="Cerrar ventana"><svg class="icon"><use href="#icon-close" /></svg></button></form>
      <div id="modal-content"></div>
    </dialog>
    <!-- Mensajes breves de confirmacion y error. -->
    <div class="toast-region" id="toast-region" role="status" aria-live="polite"></div>
